<script type="module">
  import { runExportedApp } from "./shinylive/shinylive.js";

  async function waitForSWController() {
    if (!("serviceWorker" in navigator)) return;
    if (navigator.serviceWorker.controller) return;

    await navigator.serviceWorker.ready;
    if (navigator.serviceWorker.controller) return;

    await new Promise((resolve) => {
      navigator.serviceWorker.addEventListener("controllerchange", resolve, {
        once: true
      });
    });
  }

  await waitForSWController();

  await runExportedApp({
    id: "root",
    appEngine: "r",
    relPath: "",
    startupMessage: true
  });

  if (navigator.serviceWorker.controller && navigator.onLine) {
    navigator.serviceWorker.controller.postMessage({
      type: "precache-webr-assets"
    });
  }
</script>
